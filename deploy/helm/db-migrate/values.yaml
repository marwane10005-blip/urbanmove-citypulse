image:
  repository: REPLACE_ECR/urbanmove/db-migrate
  tag: latest
  pullPolicy: IfNotPresent

hook:
  enabled: false
  weight: "0"

backoffLimit: 2
activeDeadlineSeconds: 600
ttlSecondsAfterFinished: 300

serviceAccount:
  create: true
  name: db-migrate
  annotations: {}

configMapName: urbanmove-config

env:
  - name: AWS_REGION
    value: eu-west-3
  - name: DB_PORT
    value: "5432"
  - name: DB_NAME
    value: "urbanmove"

envFrom:
  - configMapRef:
      name: urbanmove-config

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
