fullnameOverride: analytics-dashboard
nameOverride: analytics-dashboard
kind: web

image:
  repository: REPLACE_ECR/urbanmove/analytics-dashboard
  tag: latest

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60

env:
  - name: LOG_LEVEL
    value: info
  - name: AWS_REGION
    value: eu-west-3

envFrom:
  - configMapRef:
      name: urbanmove-config
