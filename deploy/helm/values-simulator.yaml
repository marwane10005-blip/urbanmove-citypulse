fullnameOverride: simulator
nameOverride: simulator
kind: worker

image:
  repository: REPLACE_ECR/urbanmove/simulator
  tag: latest

replicaCount: 1

autoscaling:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

env:
  - name: FLEET_SIZE
    value: "100"
  - name: PUBLISH_HZ
    value: "1.0"
  - name: AWS_REGION
    value: eu-west-3
  - name: CLIENT_ID
    value: "urbanmove-simulator"
  - name: TOPIC
    value: "urbanmove/fleet/urbanmove-simulator/telemetry"

envFrom:
  - configMapRef:
      name: urbanmove-config
