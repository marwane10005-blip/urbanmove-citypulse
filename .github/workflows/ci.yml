name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-services:
    name: Python ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - simulator
          - mobility-api
          - identity-fleet
          - analytics-dashboard
          - stream-processor
          - ml-training
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        if: hashFiles(format('apps/{0}/requirements.txt', matrix.service)) != ''
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy --install-types --non-interactive src || true
      - name: Test (pytest)
        run: pytest -q
        if: hashFiles(format('apps/{0}/tests/**', matrix.service)) != ''

  web:
    name: Next.js dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker-build:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [python-services, web]
    strategy:
      fail-fast: false
      matrix:
        service:
          - simulator
          - mobility-api
          - identity-fleet
          - analytics-dashboard
          - stream-processor
          - ml-training
          - dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.service }}
          push: false
          tags: urbanmove/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
