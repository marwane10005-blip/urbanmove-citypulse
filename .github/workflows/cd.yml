name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-3
  CLUSTER_NAME: urbanmove-dev-eks

jobs:
  build-and-push:
    name: Build + push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - simulator
          - mobility-api
          - identity-fleet
          - analytics-dashboard
          - stream-processor
          - ml-training
          - dashboard-web
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/urbanmove/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/urbanmove/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  helm-deploy:
    name: Helm upgrade
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm upgrade all services
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          for svc in mobility-api identity-fleet analytics-dashboard stream-processor dashboard-web; do
            helm upgrade --install "$svc" deploy/helm/common-service \
              -f deploy/helm/common-service/values.yaml \
              -f deploy/helm/values-"$svc".yaml \
              --set image.repository="${ECR_REGISTRY}/urbanmove/${svc}" \
              --set image.tag="${IMAGE_TAG}" \
              --namespace urbanmove \
              --create-namespace \
              --wait \
              --timeout 5m
          done
